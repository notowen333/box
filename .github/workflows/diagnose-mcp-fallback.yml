name: Diagnose MCP fallback
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string
jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Namespace support
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount --pid --fork --mount-proc true
      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-fallback-review
          cache-on-failure: true
      - name: Build containment helper
        run: cargo build --locked -p strands-box-containment --bin strands-box-contain-trampoline --all-features
      - name: Test MCP routes
        run: cargo test --locked -p strands-box --all-features --test runtime_mcp_start --test mcp_alias_fallback -- --show-output
